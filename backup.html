<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 - Page Not Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      height:100vh;

      background:#050505;

      display:flex;

      justify-content:center;

      align-items:center;

      overflow:hidden;

      color:white;

      position:relative;

    }

    /* BACKGROUND GLOW */

    body::before{

      content:"";

      position:absolute;

      width:500px;

      height:500px;

      background:rgba(255,176,0,0.15);

      border-radius:50%;

      filter:blur(120px);

      animation:moveGlow 6s infinite alternate;

    }

    @keyframes moveGlow{

      from{
        transform:translate(-100px,-50px);
      }

      to{
        transform:translate(100px,50px);
      }

    }

    .container{

      text-align:center;

      z-index:2;

      padding:20px;

    }

    .error-code{

      font-size:180px;

      font-weight:700;

      color:#ffb000;

      line-height:1;

      text-shadow:0 0 25px rgba(255,176,0,0.5);

      animation:float 3s ease-in-out infinite;

    }

    @keyframes float{

      0%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-10px);
      }

      100%{
        transform:translateY(0);
      }

    }

    h2{

      font-size:42px;

      margin-top:10px;

      margin-bottom:20px;

    }

    p{

      color:#bbb;

      max-width:600px;

      margin:auto;

      line-height:1.8;

      margin-bottom:35px;

    }

    .home-btn{

      display:inline-block;

      background:#ffb000;

      color:white;

      text-decoration:none;

      padding:15px 35px;

      border-radius:40px;

      font-size:18px;

      font-weight:600;

      transition:0.4s;

      box-shadow:0 10px 25px rgba(255,176,0,0.3);

    }

    .home-btn:hover{

      transform:translateY(-5px);

      background:white;

      color:#111;

    }

    .gear{

      position:absolute;

      opacity:0.08;

      animation:rotate 20s linear infinite;

    }

    .gear1{

      width:250px;

      top:10%;

      left:5%;

    }

    .gear2{

      width:200px;

      bottom:10%;

      right:5%;

      animation-direction:reverse;

    }

    @keyframes rotate{

      100%{
        transform:rotate(360deg);
      }

    }

    @media(max-width:768px){

      .error-code{

        font-size:120px;

      }

      h2{

        font-size:30px;

      }

      p{

        font-size:15px;

      }

    }

  </style>

</head>

<body>

  <!-- BACKGROUND GEARS -->

  <img 
  src="https://cdn-icons-png.flaticon.com/512/857/857681.png"
  class="gear gear1"
  alt="gear">

  <img 
  src="https://cdn-icons-png.flaticon.com/512/857/857681.png"
  class="gear gear2"
  alt="gear">

  <!-- CONTENT -->

  <div class="container">

    <div class="error-code">404</div>

    <h2>Page Not Found</h2>

    <p>

      Oops! The page you are looking for does not exist,
      has been moved or temporarily unavailable.

    </p>

    <a href="index.html" class="home-btn">

      Back To Home

    </a>

  </div>

</body>

</html>
