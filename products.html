<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aluminium Windows</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins,sans-serif;
    }

    body{
      background:#0b0b0b;
      color:white;
    }

    .hero{

      height:60vh;

      background:url('https://i.pinimg.com/736x/4d/e0/2e/4de02e5067b4db95d2d0ec0f39f11e5b.jpg');

      background-size:cover;

      background-position:center;

      display:flex;

      justify-content:center;

      align-items:center;

      text-align:center;

    }

    .hero h1{

      font-size:60px;

      background:rgba(0,0,0,0.5);

      padding:20px 40px;

      border-radius:10px;

    }

    .gallery{

      padding:80px 5%;

      display:grid;

      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

      gap:20px;

    }

    .gallery img{

      width:100%;

      height:320px;

      object-fit:cover;

      border-radius:15px;

      transition:0.5s;

    }

    .gallery img:hover{

      transform:scale(1.05);

    }

    .contact-btn{

      position:fixed;

      right:25px;

      bottom:25px;

      background:#25D366;

      color:white;

      text-decoration:none;

      padding:16px 28px;

      border-radius:40px;

      font-size:18px;

      font-weight:600;

      box-shadow:0 10px 25px rgba(0,0,0,0.3);

    }

  </style>

</head>

<body>

  <section class="hero">

    <h1>Aluminium Windows</h1>

  </section>

  <section class="gallery">

    <img src="https://i.pinimg.com/736x/4d/e0/2e/4de02e5067b4db95d2d0ec0f39f11e5b.jpg">

    <img src="https://i.pinimg.com/736x/85/8c/9f/858c9f0f4dca85fd9eab3d9712f4b89f.jpg">

    <img src="https://i.pinimg.com/736x/ab/4d/f8/ab4df8f0c1f48995d437c2a1a8795ef4.jpg">

    <img src="https://i.pinimg.com/736x/e7/e0/1b/e7e01bcfb4cc6e4f9551f1f4f5c95a3d.jpg">

    <img src="https://i.pinimg.com/736x/7f/1c/4b/7f1c4bc67f2b0d0f69b1f25c932d6824.jpg">

    <img src="https://i.pinimg.com/736x/d8/83/29/d8832944b4e79d42d7a4fc7f7494ecb2.jpg">

  </section>

  <a 
  href="https://wa.me/918889401678"
  target="_blank"
  class="contact-btn">

    Contact Us

  </a>

</body>

</html>
